name: Fork CI and upstream sync

on:
  push:
    branches: [feat/conditional-struts]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'mraxime/umbriel'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.upstream.outputs.needed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'schedule'
        with:
          ref: feat/conditional-struts
          fetch-depth: 0
          persist-credentials: false
      - name: Check upstream
        id: upstream
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != schedule ]]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch https://github.com/noctalia-dev/umbriel.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'needed=true' >> "$GITHUB_OUTPUT"

  sync:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git jemalloc meson ninja pkgconf \
            cairo lcms2 libdisplay-info libdrm libinput libxkbcommon mesa pango pixman \
            nlohmann-json tomlplusplus wayland wayland-protocols wlroots0.20
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'feat/conditional-struts' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Rebase onto upstream
        if: github.event_name != 'push'
        id: rebase
        shell: bash
        run: |
          set -euo pipefail
          echo "previous=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/noctalia-dev/umbriel.git
          git fetch upstream main
          git rebase upstream/main
      - name: Build and test as an unprivileged user
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          runuser --user ci -- meson setup build -Dtests=enabled
          runuser --user ci -- meson compile -C build -j 2
          runuser --user ci -- meson test -C build --print-errorlogs
      - name: Publish only after tests pass
        if: github.event_name != 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.rebase.outputs.previous }}
        run: |
          set -euo pipefail
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' \
            push --atomic --force-with-lease="refs/heads/feat/conditional-struts:$PREVIOUS" origin \
              HEAD:refs/heads/feat/conditional-struts refs/remotes/upstream/main:refs/heads/main
